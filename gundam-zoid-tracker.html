<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Parts Catalog — Gundam &amp; Zoid Price Tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --paper:#EEEDE6;
  --paper-raised:#F6F5F0;
  --grid:#D7DCE2;
  --ink:#1B2A41;
  --ink-soft:#4A5A70;
  --blue:#2F5D8A;
  --rust:#C4432B;
  --green:#3F7A5C;
  --muted:#8A8F94;
  --line:#C7CDD3;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0/100% 28px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 100%,
    var(--paper);
  font-family:'Inter',sans-serif;
  color:var(--ink);
  min-height:100vh;
  padding:32px 20px 80px;
}

.wrap{max-width:1080px;margin:0 auto;}

/* Header */
.header{
  border-bottom:3px solid var(--ink);
  padding-bottom:16px;
  margin-bottom:24px;
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  flex-wrap:wrap;
  gap:12px;
}
.header .eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  letter-spacing:.14em;
  color:var(--rust);
  font-weight:700;
  text-transform:uppercase;
}
.header h1{
  font-family:'JetBrains Mono',monospace;
  font-size:clamp(26px,5vw,38px);
  font-weight:800;
  margin:2px 0 0;
  letter-spacing:-.01em;
}
.header .sub{
  font-size:13px;
  color:var(--ink-soft);
  max-width:340px;
  text-align:right;
  line-height:1.4;
}

/* Toolbar */
.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:center;
  margin-bottom:22px;
}
.tabs{display:flex;gap:6px;font-family:'JetBrains Mono',monospace;font-size:12px;}
.tab{
  padding:7px 12px;
  border:1.5px solid var(--ink);
  background:transparent;
  color:var(--ink);
  cursor:pointer;
  font-family:inherit;
  font-weight:600;
  letter-spacing:.03em;
}
.tab.active{background:var(--ink);color:var(--paper);}
.spacer{flex:1;}
select, input[type=text], input[type=search]{
  font-family:'Inter',sans-serif;
  font-size:13px;
  border:1.5px solid var(--line);
  background:var(--paper-raised);
  color:var(--ink);
  padding:7px 10px;
}
input[type=search]{min-width:180px;}
.btn{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:.03em;
  background:var(--rust);
  color:#fff;
  border:none;
  padding:9px 14px;
  cursor:pointer;
}
.btn:hover{background:#a8341f;}
.btn.secondary{
  background:transparent;
  color:var(--ink);
  border:1.5px solid var(--ink);
}
.btn.secondary:hover{background:var(--ink);color:var(--paper);}
.btn.small{padding:5px 10px;font-size:11px;}

/* Empty state */
.empty{
  border:2px dashed var(--line);
  padding:48px 20px;
  text-align:center;
  color:var(--ink-soft);
  font-size:14px;
}
.empty b{display:block;font-family:'JetBrains Mono',monospace;font-size:16px;color:var(--ink);margin-bottom:6px;}

/* Grid of cards */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:18px;
}

.card{
  background:var(--paper-raised);
  border:1.5px solid var(--ink);
  position:relative;
  padding:16px 16px 14px;
}
.card::before{
  content:'';
  position:absolute;
  top:-7px;left:20px;
  width:14px;height:14px;
  background:var(--paper);
  border:1.5px solid var(--ink);
  border-radius:50%;
}
.card-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  border-bottom:1px dashed var(--line);
  padding-bottom:10px;
  margin-bottom:10px;
}
.card-thumb{
  width:44px;height:44px;
  object-fit:contain;
  background:var(--paper);
  border:1px solid var(--line);
  flex-shrink:0;
  margin-right:10px;
}
.partno{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--muted);
  letter-spacing:.08em;
}
.badge{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  font-weight:700;
  letter-spacing:.06em;
  padding:2px 7px;
  border:1px solid currentColor;
  text-transform:uppercase;
}
.badge.gundam{color:var(--blue);}
.badge.zoid{color:var(--green);}
.badge.other{color:var(--muted);}
.badge.source-marketplace{color:var(--rust);}
.badge.source-retailer{color:var(--ink-soft);}

.kit-name{font-size:16px;font-weight:700;margin:0 0 2px;}
.kit-grade{font-size:12px;color:var(--ink-soft);margin-bottom:2px;}
.kit-notes{font-size:12px;color:var(--muted);font-style:italic;}

.price-row{
  display:flex;
  align-items:baseline;
  gap:8px;
  margin:12px 0 8px;
}
.lowest-price{
  font-family:'JetBrains Mono',monospace;
  font-size:26px;
  font-weight:800;
  color:var(--green);
}
.lowest-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  background:var(--green);
  color:#fff;
  padding:2px 6px;
  font-weight:700;
}
.no-price{font-size:13px;color:var(--muted);margin:12px 0 8px;}
.lowest-seller{font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.lowest-seller a{color:var(--blue);}

.card-actions{display:flex;gap:8px;margin-bottom:6px;}

.history{
  margin-top:10px;
  border-top:1px dashed var(--line);
  padding-top:10px;
}
.history-toggle{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  cursor:pointer;
  background:none;
  border:none;
  padding:0;
  text-decoration:underline;
}
.steps{margin-top:8px;position:relative;padding-left:16px;}
.steps::before{
  content:'';
  position:absolute;left:4px;top:4px;bottom:4px;
  width:1px;background:var(--line);
}
.step{
  position:relative;
  font-size:12px;
  padding:4px 0 4px 10px;
  display:flex;
  justify-content:space-between;
  gap:8px;
}
.step::before{
  content:'';
  position:absolute;left:-16px;top:9px;
  width:7px;height:7px;border-radius:50%;
  background:var(--paper-raised);
  border:1.5px solid var(--ink-soft);
}
.step.lowest::before{background:var(--green);border-color:var(--green);}
.step .meta{color:var(--muted);}
.step .price{font-family:'JetBrains Mono',monospace;font-weight:700;}
.step .del{
  cursor:pointer;color:var(--rust);font-size:11px;
  background:none;border:none;font-family:'JetBrains Mono',monospace;
}

.card-icons{
  position:absolute;top:8px;right:8px;
  display:flex;gap:8px;
}
.edit-kit, .delete-kit{
  background:none;border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:13px;
  line-height:1;
}
.edit-kit:hover{color:var(--blue);}
.delete-kit:hover{color:var(--rust);}
.match-term{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;
  color:var(--muted);
  margin:-4px 0 8px;
}

/* Modal */
.overlay{
  position:fixed;inset:0;background:rgba(27,42,65,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:50;padding:20px;
}
.modal{
  background:var(--paper-raised);
  border:2px solid var(--ink);
  width:100%;max-width:400px;
  padding:20px;
}
.modal h2{
  font-family:'JetBrains Mono',monospace;
  font-size:16px;margin:0 0 14px;
  border-bottom:2px solid var(--ink);
  padding-bottom:8px;
}
.field{margin-bottom:12px;}
.field label{
  display:block;font-size:11px;font-family:'JetBrains Mono',monospace;
  color:var(--ink-soft);margin-bottom:4px;letter-spacing:.03em;
}
.field input, .field select, .field textarea{
  width:100%;padding:8px 9px;border:1.5px solid var(--line);
  font-family:'Inter',sans-serif;font-size:13px;background:var(--paper);
}
.field textarea{resize:vertical;min-height:50px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}

.status-line{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--muted);
  margin:-12px 0 16px;
}
.status-line a{color:var(--blue);cursor:pointer;text-decoration:underline;}
.btn.secondary:disabled{opacity:.5;cursor:default;}
.btn[data-loading="1"]{opacity:.6;cursor:wait;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);
  font-family:'JetBrains Mono',monospace;font-size:12px;
  padding:9px 16px;z-index:60;opacity:0;transition:opacity .25s;
  pointer-events:none;
}
.toast.show{opacity:1;}

.ship-toggle{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  display:flex;align-items:center;gap:5px;
  cursor:pointer;
  user-select:none;
}
.ship-toggle input{accent-color:var(--rust);cursor:pointer;}
.price-breakdown{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  margin:-4px 0 8px;
}
.price-breakdown-free{color:var(--green);font-weight:700;}
.step .ship-note{color:var(--muted);}

.mode-tabs{
  display:flex;gap:0;
  margin-bottom:16px;
  border-bottom:2px solid var(--ink);
}
.mode-tab{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:12px;
  letter-spacing:.04em;
  background:transparent;
  border:none;
  padding:9px 4px;
  margin-right:22px;
  color:var(--muted);
  cursor:pointer;
  border-bottom:3px solid transparent;
  position:relative;top:2px;
}
.mode-tab.active{color:var(--ink);border-bottom-color:var(--rust);}

.browse-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1.5px solid var(--ink);}
.browse-row{
  background:var(--paper-raised);
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.browse-thumb{
  width:52px;height:52px;
  object-fit:contain;
  background:var(--paper);
  border:1px solid var(--line);
  flex-shrink:0;
}
.browse-thumb-placeholder{
  width:52px;height:52px;
  background:var(--paper);
  border:1px dashed var(--line);
  flex-shrink:0;
}
.browse-row-main-group{display:flex;align-items:center;gap:12px;flex:1;min-width:220px;}
.browse-main{flex:1;min-width:180px;}
.browse-title{font-size:13px;font-weight:600;margin-bottom:2px;}
.browse-meta{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink-soft);
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.browse-price-block{text-align:right;}
.site-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.site-chip{
  display:flex;gap:6px;align-items:center;
  border:1px solid var(--line);
  padding:3px 8px;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;
  color:var(--ink);
  text-decoration:none;
  background:var(--paper);
}
.site-chip:hover{border-color:var(--blue);}
.site-chip-name{color:var(--ink-soft);}
.site-chip-price{font-weight:700;color:var(--green);}
.badge.multi-site{color:var(--blue);}
.browse-price{
  font-family:'JetBrains Mono',monospace;
  font-weight:800;
  font-size:16px;
  color:var(--green);
  white-space:nowrap;
}
.browse-actions{display:flex;gap:8px;align-items:center;}
.browse-actions a{
  font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--blue);
}

@media(max-width:480px){
  .header{flex-direction:column;align-items:flex-start;}
  .header .sub{text-align:left;}
}

.browse-layout{display:flex;gap:20px;align-items:flex-start;}
.main-panel{flex:1;min-width:0;}
.sidebar{
  width:150px;flex-shrink:0;
  display:flex;flex-direction:column;gap:2px;
  border:1.5px solid var(--ink);
  background:var(--paper-raised);
  padding:10px;
}
.sidebar-title{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;letter-spacing:.08em;
  color:var(--muted);text-transform:uppercase;
  margin-bottom:6px;
}
.sidebar-item{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'JetBrains Mono',monospace;
  font-size:12px;
  padding:6px 8px;
  background:none;border:none;
  color:var(--ink-soft);
  cursor:pointer;text-align:left;
}
.sidebar-item:hover{background:var(--paper);}
.sidebar-item.active{background:var(--ink);color:var(--paper);font-weight:700;}
.sidebar-item .count{color:var(--muted);font-size:11px;}
.sidebar-item.active .count{color:var(--paper);opacity:.7;}
.sidebar[hidden]{display:none;}

@media(max-width:680px){
  .browse-layout{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;gap:6px;}
  .sidebar-title{width:100%;}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div>
      <div class="eyebrow">No. 0001 — Field Reference</div>
      <h1>PARTS CATALOG</h1>
    </div>
    <div class="sub">Browse every scraped Gundam &amp; Zoid listing, or track specific kits with price history. Lowest confirmed price surfaces automatically.</div>
  </div>

  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="browse-all">BROWSE ALL</button>
    <button class="mode-tab" data-mode="browse-retailer">RETAILERS</button>
    <button class="mode-tab" data-mode="browse-reseller">RESELLERS</button>
    <button class="mode-tab" data-mode="mykits">MY KITS</button>
  </div>

  <div class="browse-layout">
    <div class="sidebar" id="productTypeSidebar"></div>
    <div class="main-panel">
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button class="tab active" data-filter="all">ALL</button>
          <button class="tab" data-filter="gundam">GUNDAM</button>
          <button class="tab" data-filter="zoid">ZOID</button>
          <button class="tab" data-filter="other" id="otherTab">OTHER</button>
        </div>
        <input type="search" id="search" placeholder="Search…">
        <select id="sort">
          <option value="price">Sort: price</option>
          <option value="price_shipping">Sort: price + shipping</option>
          <option value="name">Sort: name A–Z</option>
          <option value="recent" id="recentOption">Sort: recently updated</option>
        </select>
        <div class="spacer"></div>
        <button class="btn secondary" id="refreshBtn">↻ REFRESH PRICES</button>
        <button class="btn secondary" id="settingsBtn" title="Data source settings">⚙</button>
        <button class="btn" id="addKitBtn">+ ADD KIT</button>
      </div>
      <div class="status-line" id="statusLine"></div>

      <div id="content"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let catalog = [];
let browseResults = [];
let settings = { dataSourceUrl: '', lastRefreshedAt: null };
let mode = 'browse-all';
let filter = 'all';
let productTypeFilter = 'all';
let sortMode = 'price';
let searchBox = '';
let loaded = false;

const PRODUCT_TYPE_LABELS = { model_kit: 'Model Kits', cards: 'Cards', other: 'Other' };
function productTypeLabel(pt){ return PRODUCT_TYPE_LABELS[pt] || 'Other'; }

const content = document.getElementById('content');
const toastEl = document.getElementById('toast');
const statusLine = document.getElementById('statusLine');

function toast(msg, durationMs){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastEl._hideTimer);
  toastEl._hideTimer = setTimeout(()=>toastEl.classList.remove('show'), durationMs || 1800);
}

function uid(){
  return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
}

// Storage keys in localStorage — this is a standalone file, so data lives
// in your browser only (per-browser, per-device, not synced anywhere).
const LS_CATALOG = 'gundamZoidTracker.catalog';
const LS_SETTINGS = 'gundamZoidTracker.settings';
const LS_BROWSE = 'gundamZoidTracker.browseResults';

async function loadCatalog(){
  content.innerHTML = '<div class="empty">Loading catalog…</div>';
  try{
    const raw = localStorage.getItem(LS_CATALOG);
    catalog = raw ? JSON.parse(raw) : [];
  }catch(e){
    catalog = [];
  }
  try{
    const raw = localStorage.getItem(LS_SETTINGS);
    if(raw) settings = Object.assign(settings, JSON.parse(raw));
  }catch(e){ /* no settings saved yet */ }
  try{
    const raw = localStorage.getItem(LS_BROWSE);
    browseResults = raw ? JSON.parse(raw) : [];
  }catch(e){
    browseResults = [];
  }
  syncToolbarForMode();
  loaded = true;
  renderStatusLine();
  render();

  // Auto-refresh on open: pull whatever the scraper last produced, without
  // waiting for a button press. Runs after the catalog is already showing
  // so the app isn't blocked on a network call before you see anything.
  if(settings.dataSourceUrl){
    refreshPrices({ silent: true });
  }
}

async function saveCatalog(){
  try{
    localStorage.setItem(LS_CATALOG, JSON.stringify(catalog));
  }catch(e){
    toast('Save failed — your browser storage may be full or blocked');
  }
}

async function saveSettings(){
  try{
    localStorage.setItem(LS_SETTINGS, JSON.stringify(settings));
  }catch(e){
    toast('Settings save failed — your browser storage may be full or blocked');
  }
}

function renderStatusLine(){
  if(settings.dataSourceUrl){
    const when = settings.lastRefreshedAt ? new Date(settings.lastRefreshedAt).toLocaleString() : 'never';
    statusLine.innerHTML = `Data source connected · auto-refreshes on open · last refreshed: ${when}`;
  } else {
    statusLine.innerHTML = `No data source set — <a id="statusSetLink">connect one</a> to enable Refresh Prices.`;
    const link = document.getElementById('statusSetLink');
    if(link) link.onclick = openSettingsModal;
  }
}

function rawPrice(p){
  return p.price;
}
function totalPrice(p){
  return p.price + (p.shipping || 0);
}
function sortValue(p){
  return sortMode === 'price_shipping' ? totalPrice(p) : rawPrice(p);
}

function lowestEntry(item){
  // "Lowest" always means the actual cheapest to buy (price + shipping,
  // treating unknown shipping as 0) — this is the badge shown at the top
  // of a kit's card, independent of how the overall list is sorted.
  if(!item.prices || item.prices.length===0) return null;
  return item.prices.reduce((a,b)=> (totalPrice(b) < totalPrice(a) ? b : a));
}

function mostRecentTimestamp(item){
  let t = item.createdAt || 0;
  (item.prices||[]).forEach(p=>{ if(p.addedAt > t) t = p.addedAt; });
  return t;
}

function shippingLineHtml(p){
  if(p.shipping === 0){
    return `<div class="price-breakdown price-breakdown-free">Free shipping</div>`;
  }
  if(typeof p.shipping === 'number'){
    return `<div class="price-breakdown">+ $${p.shipping.toFixed(2)} shipping</div>`;
  }
  return '';
}

function pickupBadgeHtml(p){
  return p.pickup ? `<div class="price-breakdown price-breakdown-free">Free local pickup</div>` : '';
}

function render(){
  if(!loaded) return;
  if(mode === 'mykits'){
    renderMyKits();
  } else {
    renderBrowseAll();
  }
}

function renderMyKits(){
  renderProductTypeSidebar([]);
  let items = catalog.filter(i => filter==='all' || i.category===filter);
  if(searchBox.trim()){
    const s = searchBox.trim().toLowerCase();
    items = items.filter(i => i.name.toLowerCase().includes(s));
  }
  items = items.slice().sort((a,b)=>{
    if(sortMode==='name') return a.name.localeCompare(b.name);
    if(sortMode==='recent') return mostRecentTimestamp(b) - mostRecentTimestamp(a);
    // sort by whichever price basis is selected; no-price items last
    const la = lowestEntry(a), lb = lowestEntry(b);
    if(!la && !lb) return a.name.localeCompare(b.name);
    if(!la) return 1;
    if(!lb) return -1;
    return sortValue(la) - sortValue(lb);
  });

  if(items.length===0){
    content.innerHTML = `<div class="empty"><b>No kits here yet</b>${catalog.length===0 ? 'Add your first kit to start tracking prices, or find one in Browse All and hit Track.' : 'Nothing matches this filter or search.'}</div>`;
    return;
  }

  content.innerHTML = `<div class="grid">${items.map(cardHtml).join('')}</div>`;

  items.forEach(item=>{
    const del = content.querySelector(`.delete-kit[data-id="${item.id}"]`);
    if(del) del.onclick = ()=> deleteKit(item.id);
    const editBtn = content.querySelector(`.edit-kit[data-id="${item.id}"]`);
    if(editBtn) editBtn.onclick = ()=> openKitModal(item.id);
    const addPriceBtn = content.querySelector(`.add-price[data-id="${item.id}"]`);
    if(addPriceBtn) addPriceBtn.onclick = ()=> openPriceModal(item.id);
    const histToggle = content.querySelector(`.history-toggle[data-id="${item.id}"]`);
    if(histToggle) histToggle.onclick = ()=> toggleHistory(item.id);
    (item.prices||[]).forEach(p=>{
      const delBtn = content.querySelector(`.del[data-id="${p.id}"]:not(.set-ship)`);
      if(delBtn) delBtn.onclick = ()=> deletePrice(item.id, p.id);
      const shipBtn = content.querySelector(`.set-ship[data-id="${p.id}"]`);
      if(shipBtn) shipBtn.onclick = ()=> setShipping(item.id, p.id);
    });
  });
}

function normalizeTitleTokens(title){
  return new Set(
    (title||'').toLowerCase()
      .replace(/[^\w\s]/g, ' ')
      .split(/\s+/)
      .filter(w => w.length > 1)
  );
}
function titleSimilarity(aTokens, bTokens){
  if(!aTokens.size || !bTokens.size) return 0;
  let inter = 0;
  aTokens.forEach(t => { if(bTokens.has(t)) inter++; });
  return inter / Math.min(aTokens.size, bTokens.size);
}

// Groups listings that are almost certainly the same physical product.
// Two-stage: exact URL match first (catches the same listing turning up
// twice, e.g. matching both category queries), then a title-similarity
// pass within the same category to catch the same product across
// different sites, which have no shared ID to match on. This is a
// best-effort heuristic — it can occasionally merge two different but
// similarly-named kits, or miss a real match if two stores phrase a
// title very differently. Skipped above a size cap to keep the browser
// responsive; that cap is rarely hit once category/search filters have
// already narrowed things down.
const GROUP_SIMILARITY_THRESHOLD = 0.72;
const GROUP_FUZZY_MATCH_CAP = 600;

function groupBrowseItems(items){
  const groups = [];
  const byUrl = new Map();
  items.forEach(r=>{
    const key = r.url || null;
    if(key && byUrl.has(key)){
      byUrl.get(key).entries.push(r);
    } else {
      const g = { entries: [r] };
      if(key) byUrl.set(key, g);
      groups.push(g);
    }
  });

  if(groups.length > GROUP_FUZZY_MATCH_CAP) return groups;

  const tokenCache = new Map();
  function tokensFor(g){
    if(!tokenCache.has(g)) tokenCache.set(g, normalizeTitleTokens(g.entries[0].title));
    return tokenCache.get(g);
  }
  const merged = [];
  const used = new Set();
  for(let i=0;i<groups.length;i++){
    if(used.has(i)) continue;
    const gi = groups[i];
    for(let j=i+1;j<groups.length;j++){
      if(used.has(j)) continue;
      const gj = groups[j];
      if((gi.entries[0].category||'') !== (gj.entries[0].category||'')) continue;
      const giSites = new Set(gi.entries.map(e=>e.site));
      if(gj.entries.some(e=>giSites.has(e.site))) continue; // don't merge two different listings from the same site
      if(titleSimilarity(tokensFor(gi), tokensFor(gj)) >= GROUP_SIMILARITY_THRESHOLD){
        gi.entries.push(...gj.entries);
        used.add(j);
      }
    }
    merged.push(gi);
  }
  return merged;
}

function renderProductTypeSidebar(baseItems){
  const sidebar = document.getElementById('productTypeSidebar');
  if(mode === 'mykits'){
    sidebar.hidden = true;
    return;
  }
  sidebar.hidden = false;
  const counts = {};
  baseItems.forEach(r=>{
    const pt = r.product_type || 'other';
    counts[pt] = (counts[pt]||0) + 1;
  });
  const preferredOrder = ['model_kit', 'cards', 'other'];
  const types = preferredOrder.filter(t => counts[t])
    .concat(Object.keys(counts).filter(t => !preferredOrder.includes(t)));

  let html = `<div class="sidebar-title">Category</div>`;
  html += `<button class="sidebar-item ${productTypeFilter==='all'?'active':''}" data-pt="all">All <span class="count">${baseItems.length}</span></button>`;
  types.forEach(pt=>{
    html += `<button class="sidebar-item ${productTypeFilter===pt?'active':''}" data-pt="${pt}">${productTypeLabel(pt)} <span class="count">${counts[pt]}</span></button>`;
  });
  sidebar.innerHTML = html;
  sidebar.querySelectorAll('.sidebar-item').forEach(btn=>{
    btn.onclick = ()=>{ productTypeFilter = btn.dataset.pt; render(); };
  });
}

function renderBrowseAll(){
  if(!settings.dataSourceUrl){
    content.innerHTML = `<div class="empty"><b>No data source connected</b>Set one in ⚙ settings to browse everything the scraper's found.</div>`;
    renderProductTypeSidebar([]);
    return;
  }
  const sourceType = mode === 'browse-retailer' ? 'retailer' : mode === 'browse-reseller' ? 'marketplace' : 'all';
  let base = browseResults.filter(r => typeof r.price === 'number');
  base = base.filter(r => filter==='all' || r.category===filter);
  base = base.filter(r => sourceType==='all' || (r.site_type||'retailer')===sourceType);
  if(searchBox.trim()){
    const s = searchBox.trim().toLowerCase();
    base = base.filter(r => (r.title||'').toLowerCase().includes(s));
  }

  renderProductTypeSidebar(base);

  let items = base.filter(r => productTypeFilter==='all' || (r.product_type||'other')===productTypeFilter);

  const groups = groupBrowseItems(items);
  groups.forEach(g => g.entries.sort((a,b)=> totalPrice(a)-totalPrice(b)));
  groups.sort((a,b)=>{
    if(sortMode==='name') return (a.entries[0].title||'').localeCompare(b.entries[0].title||'');
    return sortValue(a.entries[0]) - sortValue(b.entries[0]);
  });

  if(groups.length===0){
    const emptyReason = browseResults.length===0
      ? 'Hit Refresh Prices, or wait for the next auto-refresh.'
      : (sourceType!=='all' ? `No ${sourceType === 'retailer' ? 'retailer' : 'reseller'} listings match this filter or search.` : 'Nothing matches this filter or search.');
    content.innerHTML = `<div class="empty"><b>Nothing here yet</b>${emptyReason}</div>`;
    return;
  }

  content.innerHTML = `<div class="browse-list">${groups.map(groupRowHtml).join('')}</div>`;

  groups.forEach((g, idx)=>{
    const btn = content.querySelector(`.track-btn[data-idx="${idx}"]`);
    if(btn) btn.onclick = ()=> trackListing(g.entries[0]);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }

// Refresh Prices — fetches the configured URL, stores the full result set
// for Browse All, and adds any new listing whose title contains a My Kits
// item's match term (or name, if no match term is set) as a new price
// entry for that kit. Runs both on manual button press and automatically
// whenever the app opens.
document.getElementById('refreshBtn').addEventListener('click', ()=> refreshPrices());

async function refreshPrices(opts){
  opts = opts || {};
  if(!settings.dataSourceUrl){
    if(!opts.silent){
      toast('Set a data source URL first (⚙)');
      openSettingsModal();
    }
    return;
  }
  const btn = document.getElementById('refreshBtn');
  btn.dataset.loading = '1';
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = 'REFRESHING…';
  try{
    // Cache-bust: raw.githubusercontent.com caches responses at its edge
    // for a few minutes regardless of the browser's own cache settings, so
    // a file that just changed (or just started existing) can serve a
    // stale response — including a stale 404 — for a short window. Adding
    // a changing query param forces a fresh lookup every time.
    const bustedUrl = settings.dataSourceUrl + (settings.dataSourceUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
    const resp = await fetch(bustedUrl, { cache: 'no-store' });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const results = Array.isArray(data) ? data : (data.results || []);
    if(!Array.isArray(results) || results.length===0){
      if(!opts.silent) toast('Data source returned no results');
      return;
    }

    // Browse All always reflects the full catalog from the last fetch.
    browseResults = results;
    try{ localStorage.setItem(LS_BROWSE, JSON.stringify(browseResults)); }catch(e){ /* ignore quota errors */ }

    // My Kits: pull in anything whose title contains a kit's match term.
    let added = 0;
    catalog.forEach(item=>{
      const term = (item.matchTerm || item.name || '').trim().toLowerCase();
      if(!term) return;
      const matches = results.filter(r => (r.title||'').toLowerCase().includes(term));
      matches.forEach(r=>{
        if(typeof r.price !== 'number' || !r.site) return;
        const dup = (item.prices||[]).some(p =>
          p.seller === r.site &&
          Math.abs(p.price - r.price) < 0.005 &&
          (p.url||'') === (r.url||'')
        );
        if(dup) return;
        item.prices = item.prices || [];
        item.prices.push({
          id: uid(),
          price: r.price,
          shipping: (typeof r.shipping === 'number') ? r.shipping : null,
          pickup: !!r.pickup,
          seller: r.site,
          condition: r.condition || '',
          url: r.url || '',
          addedAt: Date.now()
        });
        added++;
      });
    });

    settings.lastRefreshedAt = Date.now();
    await saveSettings();
    renderStatusLine();

    if(added > 0){
      await saveCatalog();
    }
    render();
    if(added > 0){
      toast(`Refreshed — ${added} new price${added===1?'':'s'} added, ${browseResults.length} listings total`);
    } else if(!opts.silent){
      toast(`Refreshed — ${browseResults.length} listings found`);
    }
  }catch(e){
    console.error('Refresh Prices failed:', e);
    if(!opts.silent) toast('Refresh failed: ' + (e.message || e) + ' — see browser console (F12) for details', 6000);
  }finally{
    btn.dataset.loading = '';
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
}

loadCatalog();
</script>
</body>
</html>
